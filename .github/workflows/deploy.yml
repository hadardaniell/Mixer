name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGION: me-west1 # Tel Aviv. Change if you prefer another Cloud Run region.
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  AR_REPO: mixer # Artifact Registry repository name (created in setup)

jobs:
  # Both images are independent, so they build in parallel — and they reuse the same gha
  # cache scopes that ci.yml populates, so an unchanged deps layer is a cache hit instead
  # of a fresh `apt-get install` + `pnpm install`.
  build:
    name: Build & push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  services:
    name: Deploy api + ai (Cloud Run)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api_url: ${{ steps.api.outputs.url }}
      ai_url: ${{ steps.ai.outputs.url }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      # --- ai first, so the api can be told where it lives ---
      - name: Deploy ai
        id: ai
        run: |
          gcloud run deploy mixer-ai \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/ai:$GITHUB_SHA" \
            --region "$REGION" --platform managed --allow-unauthenticated \
            --port 8080 --memory 2Gi --cpu 1 --timeout 300 \
            --set-env-vars "^##^GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}##GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          echo "url=$(gcloud run services describe mixer-ai --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # --- api ---
      - name: Deploy api
        id: api
        run: |
          gcloud run deploy mixer-api \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/api:$GITHUB_SHA" \
            --region "$REGION" --platform managed --allow-unauthenticated \
            --port 8080 --memory 1Gi --cpu 1 --timeout 300 \
            --set-env-vars "^##^MONGO_URL=${{ secrets.MONGO_URL }}##MONGO_DB=${{ secrets.MONGO_DB }}##JWT_SECRET=${{ secrets.JWT_SECRET }}##GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}##PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}##FIREBASE_PROJECT_ID=$PROJECT_ID##AI_BASE_URL=${{ steps.ai.outputs.url }}"
          echo "url=$(gcloud run services describe mixer-api --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

  web:
    name: Deploy web (Firebase Hosting)
    needs: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's "packageManager" field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mixer/contracts build
      # app.config.ts silently falls back to http://localhost:3000 when these are empty,
      # which produces a web app that builds and deploys fine but can't reach anything.
      - name: Verify the bundle has real service URLs
        run: |
          for pair in "API:${{ needs.services.outputs.api_url }}" "AI:${{ needs.services.outputs.ai_url }}" \
                      "GOOGLE_WEB_CLIENT_ID:${{ secrets.GOOGLE_WEB_CLIENT_ID }}"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty — the web bundle would ship a broken default."
              exit 1
            fi
          done
      - name: Build web bundle
        env:
          # baked into the static bundle so the web app calls the deployed services
          EXPO_PUBLIC_API_BASE_URL: ${{ needs.services.outputs.api_url }}
          EXPO_PUBLIC_AI_BASE_URL: ${{ needs.services.outputs.ai_url }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: pnpm --filter @mixer/mobile build:web
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
