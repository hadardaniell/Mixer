name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button, so a run can be started without inventing a commit —
  # useful when a run was lost to a runner outage rather than to a real failure.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's "packageManager" field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # contracts must be built first — the apps consume its emitted types
      - run: pnpm --filter @mixer/contracts build
      - run: pnpm typecheck

  docker-build:
    name: Docker build (${{ matrix.service }})
    # Not on a push to main: deploy.yml builds these same two images there, and every
    # change reaches main through a PR, so they're already smoke-tested by then —
    # building twice just makes the deploy wait. A manual run still builds them.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          load: true # keep the image in the local daemon for the smoke test below
          tags: mixer-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # A successful build says nothing about whether the runtime stage can actually
      # resolve its imports (workspace links live outside the copied node_modules).
      # Resolve the whole entrypoint graph without booting the service — no env/DB needed.
      - name: Smoke test — module graph resolves
        # Dummy keys: some SDK clients are constructed at module scope and throw on an
        # empty key. Nothing is called, so the values are never used — no secrets needed,
        # which keeps this job safe to run on PRs from forks.
        run: |
          docker run --rm --entrypoint node \
            -e GROQ_API_KEY=ci-smoke-test -e GEMINI_API_KEY=ci-smoke-test \
            "mixer-${{ matrix.service }}:ci" \
            -e "import('./dist/app.js').then(() => console.log('imports ok'))"

      # Importing succeeds even when a dep resolves to the WRONG major (the hoisted root
      # copy instead of the app's nested one) — that only blows up on the first request.
      - name: Smoke test — deps resolve to the declared majors
        run: |
          docker run --rm --entrypoint node \
            -v "$PWD/scripts:/smoke:ro" \
            "mixer-${{ matrix.service }}:ci" \
            /smoke/check-app-deps.cjs "/app/apps/${{ matrix.service }}"
